[package]
name = "hyperminhash-rs"
version = "0.1.0"
authors = ["Jianshu Zhao"]
repository = "https://github.com/jianshu93/HyperMinHash-rs"
description = "Heap-backed HyperMinHash with configurable precision and set comparison"
edition = "2024"
license = "MIT"

[dependencies]
xxhash-rust = { version = "0.8", features = [ "std", "xxh3" ] }
serde = { version = "1", optional = true, features = ["derive"] }

[lib]
name = "hyperminhash"

[dev-dependencies]
rand = "0.10"
crossbeam = "0.8"
memchr = "2"
criterion = "0.8"
walkdir = "2"
serde_json = "1"
bincode = "1.3"
rayon = "1"

[features]
default = []
serialize = ["dep:serde"]

[[bench]]
name = "benches"
harness = false
